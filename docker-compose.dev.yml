name: docflow-dev

services:
  postgres:
    image: postgres:16.2-alpine
    container_name: docflow-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docflow} -d ${POSTGRES_DB:-docflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docflow-dev-net

  redis:
    image: redis:7-alpine
    container_name: docflow-dev-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-docflow_redis_dev_secret}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-docflow_redis_dev_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docflow-dev-net

  silo:
    image: pgsty/silo:latest
    container_name: docflow-dev-silo
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-silo_admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-silo_admin_dev_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${SILO_API_PORT:-9000}:9000"
      - "${SILO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - silo_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docflow-dev-net

  silo-setup:
    image: pgsty/mc:latest
    container_name: docflow-dev-silo-setup
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mcli alias set local http://silo:9000 "${SILO_ROOT_USER:-silo_admin}" "${SILO_ROOT_PASSWORD:-silo_admin_dev_secret}"
        mcli mb --ignore-existing local/${S3_BUCKET_MEDIA_RAW:-media-raw}
        mcli mb --ignore-existing local/${S3_BUCKET_MEDIA_PROCESSED:-media-processed}
        mcli mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-documents}
        mcli version enable local/${S3_BUCKET_DOCUMENTS:-documents}
        mcli admin user add local "${S3_ACCESS_KEY:-docflow_app_dev}" "${S3_SECRET_KEY:-docflow_app_dev_secret}"
        mcli admin policy attach local readwrite --user "${S3_ACCESS_KEY:-docflow_app_dev}" || true
        echo "Buckets e usuário de desenvolvimento configurados no Silo com sucesso!"
    networks:
      - docflow-dev-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: docflow-dev-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - docflow-dev-net

volumes:
  postgres_dev_data:
  redis_dev_data:
  silo_dev_data:

networks:
  docflow-dev-net:
    driver: bridge
