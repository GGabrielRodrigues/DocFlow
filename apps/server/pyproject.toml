[tool.poetry]
name = "docflow-server"
version = "0.1.0"
description = "API e workers do DocFlow"
authors = []
packages = [{ include = "docflow", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115,<1.0"
pydantic-settings = ">=2.6,<3.0"
uvicorn = { version = ">=0.32,<1.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.24,<1.0"
pytest-cov = ">=5.0,<7.0"
hypothesis = ">=6.100,<7.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.8,<1.0"
mypy = ">=1.13,<2.0"
import-linter = ">=2.1,<3.0"
pre-commit = ">=3.8,<5.0"

[tool.poetry.scripts]
docflow-api = "docflow.main:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["docflow"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.importlinter]
root_package = "docflow"

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers"
type = "forbidden"
source_modules = ["docflow.domain"]
forbidden_modules = ["docflow.api", "docflow.application", "docflow.core", "docflow.infra"]
