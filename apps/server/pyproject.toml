[tool.poetry]
name = "docflow-server"
version = "0.1.0"
description = "API e workers do DocFlow"
authors = []
packages = [{ include = "docflow", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115,<1.0"
pydantic-settings = ">=2.6,<3.0"
uvicorn = { version = ">=0.32,<1.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
httpx = ">=0.27,<1.0"

[tool.poetry.scripts]
docflow-api = "docflow.main:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
