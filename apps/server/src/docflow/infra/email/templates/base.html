<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DocFlow{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .card {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 28px 32px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 4px 0 0 0;
      color: #bfdbfe;
      font-size: 13px;
    }
    .content {
      padding: 32px;
    }
    .footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 20px 32px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 6px;
      margin: 20px 0;
      text-align: center;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .fallback-url {
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
      margin-top: 12px;
    }
    .highlight-box {
      background-color: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 14px 18px;
      margin: 18px 0;
      border-radius: 0 6px 6px 0;
    }
    .token-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #1e3a8a;
      background-color: #eff6ff;
      border: 1px dashed #3b82f6;
      border-radius: 6px;
      padding: 10px 16px;
      display: inline-block;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <h1>DocFlow</h1>
        <p>Gestão e Automação Documental Inteligente</p>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        {% block footer %}
        <p>Esta é uma notificação automática gerada pela plataforma DocFlow.</p>
        <p>Por favor, não responda diretamente a esta mensagem.</p>
        {% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
